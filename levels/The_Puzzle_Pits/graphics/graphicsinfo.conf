# The Puzzle Pits' own letters (made by tools/pitsfont.mjs from PLASMA1.FNT)

# the scripts' text: engraved, on the game's grey stone
font.envelope_1:                        pits_font_stone.png
font.envelope_1.x:                      0
font.envelope_1.y:                      0
font.envelope_1.width:                  16
font.envelope_1.height:                 18
font.envelope_1.frames:                 95
font.envelope_1.frames_per_line:        16

background.envelope_1:                  pits_stone.png
background.envelope_1.x:                0
background.envelope_1.y:                0
background.envelope_1.width:            48
background.envelope_1.height:           54

# on the pit (the typing room, the pointer): white with a shadow
font.input_1:                           pits_font_shadow.png
font.input_1.x:                         0
font.input_1.y:                         0
font.input_1.width:                     16
font.input_1.height:                    18
font.input_1.frames:                    95
font.input_1.frames_per_line:           16

# the main menu's (the player's name) as R'n'D has it: a level set's
# font.input_1 would otherwise be it too
font.input_1.MAIN:                      RocksFontBig.png
font.input_1.MAIN.x:                    0
font.input_1.MAIN.y:                    0
font.input_1.MAIN.width:                32
font.input_1.MAIN.height:               32

